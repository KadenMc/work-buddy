    prerequisite: configured-non-archived-roots
    evidence:
      - "Vault index reads configured filesystem roots and does not require the Obsidian app or bridge."
      - "Sealed domain roots are pruned before traversal and direct parsing; the first authority-aware refresh deletes their previously indexed rows."
  - id: native-search-partitions
    kind: search-authority
    asset: work_buddy/index/cutover_evidence.py
    decision: retarget
    status: implemented
    owner: native-domain-search
    prerequisite: journal-projects-contracts-personal-knowledge-authority-ledgers
    evidence:
      - "Journal, Projects, Contracts, and Personal Knowledge register database-backed consolidated-index partitions with per-domain refresh jobs."
      - "Transactional outbox batches are acknowledged only after a completed build and source/index parity check; force is a replay-safe partition backfill."
      - "The bounded checkpoint step derives all database paths from configuration, checkpoints the four domain WALs plus the consolidated index, and emits wb.search-cutover-checkpoint-evidence/v1 before immutable certification."
      - "The read-only certifier derives wb.search-cutover-evidence/v1 from registry, authority, build ledger, native visibility, and pending outbox state."
      - "A Project source row with no native index document fails closed; the cutover rehearsal proves zero delegated or empty items for the accepted cohort."
