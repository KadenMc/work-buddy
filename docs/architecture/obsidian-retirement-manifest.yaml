schema_version: work-buddy/obsidian-retirement-manifest/v1
scope: >-
  Obsidian-dependent product surfaces affected by the database-content
  cut-away. This is a code-state manifest only: it does not flip a live
  authority seal, edit config.local.yaml, or delete migration source files.
decisions:
  - keep
  - retarget
  - disable
  - remove
invariants:
  - "Every item has an owner, prerequisite, status, and repository evidence."
  - "Opting Obsidian out causes no bridge/plugin probes, retries, notification delivery, or setup advice."
  - "Native Calendar is owned by google_calendar_native and never inherits the Obsidian plugin dependency."
  - "work_buddy/obsidian remains explicit compatibility/import/export/filesystem-fallback code; native authority seals guard normal domain mutations."
  - "No row authorizes a live authority flip or post-seal Markdown write."

