name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WORK_BUDDY_SESSION_ID: ci-test-00000000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Keep in sync with packaging/vendor_uv.py and release.yml UV_VERSION.
          version: "0.11.26"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (uv provisions Python 3.11 per requires-python)
        run: uv sync

      - name: Audit dashboard mutation policy
        run: uv run python -m scripts.audit_dashboard_mutations --json

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=work_buddy \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q --tb=short

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  dashboard-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: dashboard-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-react/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Run dashboard unit tests
        run: npm test -- --maxWorkers=4

      - name: Install dashboard browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Check browser spec CI decisions
        run: npx playwright test --list --reporter=./scripts/check-spec-tags.mjs

      - name: Run dashboard browser tests selected for CI
        run: npx playwright test --grep '(^|\s)@ci(?=\s|$)' --workers=2

      - name: Build dashboard production assets
        run: npm run build
